   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #287c7e" x="355.95" y="109.38113" transform="rotate(-0 355.95 109.38113)">消息编码与还原</text>
   </g>
