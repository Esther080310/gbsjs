    <text style="font-weight: 700; font-size: 18px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #17324d" x="23.94" y="40.012988" transform="rotate(-0 23.94 40.012988)">通信缩减  保留任务决策并降低消息数值精度</text>
