   <g id="text_1">
    <text style="font-weight: 700; font-size: 18px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #17324d" x="23.94" y="40.032675" transform="rotate(-0 23.94 40.032675)">年度更新  冻结节点编码器并回放历史样本</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #5d6977" x="23.94" y="60.312375" transform="rotate(-0 23.94 60.312375)">新通报按企业与违规发生年度修正标签；增量候选通过当前保留集检查后才接受</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #17324d" x="114.615" y="99.40193" transform="rotate(-0 114.615 99.40193)">新信息到达</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #17324d" x="114.615" y="129.4881" transform="rotate(-0 114.615 129.4881)">新年度特征 / 后续违规通报</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #17324d" x="114.615" y="185.33393" transform="rotate(-0 114.615 185.33393)">标签与表示缓存</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(47.015 207.931162)">旧键修正标签，新键计算表示</text>
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(52.215 225.6656)">编码器版本变化则重建缓存</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #287c7e" x="360.135" y="99.407555" transform="rotate(-0 360.135 99.407555)">融合端增量训练</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(302.935 129.584037)">冻结：节点与审计编码器</text>
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(318.535 147.211225)">更新：融合端参数</text>
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(360.135 161.329225)"/>
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(298.887937 182.704475)">每批128条新增 / 修正样本</text>
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(309.19125 200.412912)">+ 128条历史回放样本</text>
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(328.036375 218.151412)">固定训练60步</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #bc6138" x="614.025" y="99.407555" transform="rotate(-0 614.025 99.407555)">保留集检查</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(549.890313 138.407787)">固定历史组 + 最新训练年度</text>
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(556.825 156.08535)">使用当前已经公开的标签</text>
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(614.025 170.1936)"/>
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(562.441 191.558287)">召回下降 &gt; 1个百分点</text>
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(551.911 209.266725)">或 AP下降 &gt; 0.01：不通过</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #bc6138" x="114.615" y="296.196117" transform="rotate(-0 114.615 296.196117)">优先评估全量重训</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(62.615 322.425662)">重大政策后新监督充足</text>
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(73.015 340.1601)">或增量候选未通过</text>
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(57.415 357.88885)">重新学习编码器与融合端</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #17324d" x="360.135" y="296.219555" transform="rotate(-0 360.135 296.219555)">全量候选也按同一规则检查</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(292.535 322.430537)">通过：保存新版本并重建缓存</text>
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(313.335 340.149537)">不通过：保留父版本</text>
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(292.535 357.883162)">记录文件哈希与父版本供回退</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #287c7e" x="614.025" y="296.21393" transform="rotate(-0 614.025 296.21393)">保存增量候选版本</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(582.825 322.461412)">增量检查通过</text>
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(551.625 340.139787)">保存新融合端并复用编码器</text>
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(546.425 357.857975)">正式发布另做原接口兼容复核</text>
   </g>
   <g id="text_17">
    <text style="font-size: 9px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #287c7e" x="613.746" y="248.6412" transform="rotate(-0 613.746 248.6412)">通过</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #bc6138" x="358.74" y="251.136" transform="rotate(-0 358.74 251.136)">增量未通过</text>
   </g>
   <g id="text_19">
    <text style="font-size: 10px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #5d6977" x="23.94" y="401.9328" transform="rotate(-0 23.94 401.9328)">回放目的是兼顾新信号与历史表现。两期实验显示成本下降，后续召回仍低于每期全量重训。</text>
   </g>
  </g>
 </g>
