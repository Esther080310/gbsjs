   <g id="text_1">
    <text style="font-weight: 700; font-size: 18px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #17324d" x="23.94" y="40.102988" transform="rotate(-0 23.94 40.102988)">隐私副模型  学习带随机性的节点表示</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #5d6977" x="23.94" y="60.331875" transform="rotate(-0 23.94 60.331875)">MID随机瓶颈用于三个内容编码器；审计控制码等消息也纳入攻击者可见范围</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #17324d" x="96.48" y="110.495555" transform="rotate(-0 96.48 110.495555)">本地原始数据</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(54.68175 153.8926)">市场 / 财务 / 治理</text>
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(50.338938 171.242725)">编码得到均值 μ = h</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #287c7e" x="328.05" y="110.48993" transform="rotate(-0 328.05 110.48993)">随机信息瓶颈</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(259.60175 144.403413)">学习 log σ²，采样 ε ~ N(0, I)</text>
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(294.352375 161.288788)">z = μ + σ ⊙ ε</text>
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(255.25 180.501163)">每个企业年度形成一份随机消息</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #17324d" x="601.47" y="110.495555" transform="rotate(-0 601.47 110.495555)">融合端</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(523.47 145.003038)">同一组随机表示供六个融合头使用</text>
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(544.27 162.705788)">预测企业风险与违规类型</text>
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(570.27 180.45485)">评价筛查效用</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #287c7e" x="238.77" y="251.856305" transform="rotate(-0 238.77 251.856305)">训练时共同优化</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(131.845813 286.917725)">总损失 = 风险与类型预测损失 + 0.1 × KL正则</text>
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(66.400563 304.682225)">KL约束随机表示分布，使模型压缩非必要信息；三节点按维度与节点取平均</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #bc6138" x="601.47" y="251.867555" transform="rotate(-0 601.47 251.867555)">模拟融合端攻击</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(549.47 278.074475)">读取消息并训练攻击器</text>
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(532.87225 295.787787)">恢复13项财务数值 / 推断属性</text>
    <text style="font-size: 10.4px; font-family: 'Microsoft YaHei'; fill: #17324d" transform="translate(548.619313 313.5466)">与相同架构S0配对比较</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9px; font-family: 'Microsoft YaHei'; text-anchor: middle; fill: #bc6138" x="601.47" y="209.8332" transform="rotate(-0 601.47 209.8332)">同样的消息</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #17324d" x="23.94" y="353.7" transform="rotate(-0 23.94 353.7)">五次独立复检：数值猜中率 75.2% → 54.7%；Recall@10% 30.13% → 29.32%。</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9.3px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #5d6977" x="23.94" y="371.9952" transform="rotate(-0 23.94 371.9952)">评价为指定攻击下的经验防护；随机瓶颈不自动提供差分隐私保证。五个种子不组成部署集成。</text>
   </g>
  </g>
 </g>
